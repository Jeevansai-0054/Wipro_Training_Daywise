<div class="container mt-4">
  <div class="row mb-4">
    <div class="col">
      <h2 class="mb-0">Our Products</h2>
      <p class="text-muted">Discover amazing products at great prices</p>
    </div>
    <div class="col-auto">
      <span class="badge bg-primary fs-6">₹ Indian Rupees</span>
    </div>
  </div>
  
  <app-loading-spinner *ngIf="isLoading" message="Loading products..."></app-loading-spinner>
  
  <div *ngIf="!isLoading && products && products.length > 0; else noProducts">
    <div class="row">
      <div class="col-md-3 mb-4" *ngFor="let product of products">
        <div class="card product-card h-100 shadow-sm">
                     <div class="product-image-container">
             <app-product-image 
               [imageUrl]="product.imageUrl || ''" 
               [altText]="product.name"
               [category]="product.category || ''">
             </app-product-image>
             <div class="product-overlay">
               <button class="btn btn-light btn-sm" (click)="viewDetails(product.id)">
                 <i class="bi bi-eye"></i> Quick View
               </button>
             </div>
           </div>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title product-title">{{ product.name }}</h5>
            <p class="card-text product-description">{{ product.description }}</p>
                         <div class="d-flex justify-content-between align-items-center mb-3">
               <div class="price-container">
                 <span class="h5 text-primary mb-0">{{ formatPrice(product.price) }}</span>
               </div>
               <span class="badge">{{ product.category }}</span>
             </div>
                            <div class="d-flex justify-content-between align-items-center">
                  <app-add-to-cart-button 
                    [isLoading]="isAddingToCart(product.id)"
                    [disabled]="product.quantity <= 0"
                    (addToCart)="addToCart(product)">
                  </app-add-to-cart-button>
                  <button class="btn btn-outline-secondary" (click)="viewDetails(product.id)">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <ng-template #noProducts>
    <div class="text-center py-5">
      <i class="bi bi-box display-1 text-muted"></i>
      <h4 class="mt-3">No products available</h4>
      <p class="text-muted">Check back later for new products!</p>
    </div>
  </ng-template>
</div>
